name: Bug report
description: mu-sdk (JS/TS) behaves differently than it says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real tokens, memory content or personal data into this form.** Redact, and
        say what you redacted.

        Security problem? Do not file it here — see
        [SECURITY.md](https://github.com/MemoryUniverse/mu-sdk-js/blob/HEAD/.github/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The call you made, and what came back instead of what you expected.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: If the README, a JSDoc comment or a type says otherwise, quote it.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest snippet that shows it. Redact the token.
      render: typescript
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which mode
      options:
        - "remote (hosted plane)"
        - "local_server (mu-engine-server over the wire)"
        - not sure
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`. There is no published release yet, so the commit is the version."
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: Node version (`node -v`), package manager, bundler if any, TypeScript version if relevant.
      placeholder: "Node 20.19.0 · npm 10.8.2 · tsc 5.6.3 · NodeNext"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error or wire trace
      description: Redacted. Text, not a screenshot. Strip the Authorization header.
      render: shell

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I removed every token, credential, memory content and personal datum from everything above.
          required: true
