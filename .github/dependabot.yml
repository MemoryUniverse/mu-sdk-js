# Two ecosystems here, because unlike the Python repos this one has a lockfile Dependabot can
# actually reason about and a small dependency surface (one runtime dependency).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      # The dev toolchain moves together and is not shipped to consumers; one PR, not five.
      dev-toolchain:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 3
